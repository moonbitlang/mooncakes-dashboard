name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 02:00 AM UTC+8

env:
  GITHUB_ACTION_RUN_ID: ${{ github.run_id }}
  GITHUB_ACTION_RUN_NUMBER: ${{ github.run_number }}

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write
  id-token: write

jobs:
  collect-data:
    strategy:
      fail-fast: false
      matrix:
        os:
          - platform: macos-latest
            name: mac
          - platform: ubuntu-latest
            name: linux
          - platform: windows-latest
            name: windows
        channel:
          - channel: latest
            name: stable
          - channel: nightly
            name: nightly
    runs-on: ${{ matrix.os.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: install MoonBit
        if: ${{ matrix.os.platform != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "${{ matrix.channel.channel }}"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
        shell: bash

      - name: install MoonBit
        if: ${{ matrix.os.platform == 'windows-latest' }}
        env:
          MOONBIT_INSTALL_VERSION: ${{ matrix.channel.channel }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup MSVC
        if: ${{ matrix.os.platform == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Version
        run: moon version --all

      - name: moon update
        run: |
          moon update

      - name: Build
        run: |
          deno run -A main.ts --repos resources/repos.yml --exclude resources/exclude.yml --channel ${{ matrix.channel.name }}

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.name }}-${{ matrix.channel.name }}
          path: './data/${{ matrix.os.name }}/${{ matrix.channel.name }}/'
          if-no-files-found: error

  publish-site:
    needs: collect-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Download all artifacts from the matrix jobs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: List downloaded artifacts
        run: ls -R ./artifacts

      # Organize data files
      - name: Organize data files
        run: |
          mkdir -p data/mac/stable data/mac/nightly data/linux/stable data/linux/nightly data/windows/stable data/windows/nightly
          cp -r artifacts/mac-stable/* data/mac/stable/
          cp -r artifacts/mac-nightly/* data/mac/nightly/
          cp -r artifacts/linux-stable/* data/linux/stable/
          cp -r artifacts/linux-nightly/* data/linux/nightly/
          cp -r artifacts/windows-stable/* data/windows/stable/
          cp -r artifacts/windows-nightly/* data/windows/nightly/

      # Bundle web.ts to web.js
      - name: Bundle web.js
        run: |
          deno bundle web.ts -o web.js

      # Prepare publish directory
      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp index.html publish/
          cp web.js publish/
          cp -r data publish/

      # Publish to GitHub Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

