name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 02:00 AM UTC+8

env:
  GITHUB_ACTION_RUN_ID: ${{ github.run_id }}
  GITHUB_ACTION_RUN_NUMBER: ${{ github.run_number }}

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write
  id-token: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.should-skip }}
    steps:
      - uses: actions/checkout@v4

      - name: install pre-release
        uses: ./.github/actions/setup
        with:
          version: pre-release

      - name: get latest version info
        id: latest
        run: |
          curl -s https://cli.moonbitlang.com/version.json > version.json
          echo "Latest version info:"
          cat version.json

          # Extract moonc version from latest release using jq
          LATEST_MOONC_VERSION=$(cat version.json | jq -r '.items[] | select(.name == "moonc") | .version')
          echo "Latest moonc version: $LATEST_MOONC_VERSION"

          # Extract date from moonc version (format: v0.6.25+d6913262c (2025-08-27))
          LATEST_DATE=$(echo "$LATEST_MOONC_VERSION" | grep -o '([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\})' | tr -d '()')
          echo "Latest date: $LATEST_DATE"
          echo "latest-date=$LATEST_DATE" >> $GITHUB_OUTPUT

      - name: get pre-release version info
        id: prerelease
        run: |
          # Get pre-release moonc version
          PRERELEASE_MOONC_VERSION=$(moonc -v 2>&1 | head -1)
          echo "Pre-release moonc version: $PRERELEASE_MOONC_VERSION"

          # Extract date from pre-release version (format: v0.6.25+d6913262c (2025-08-27))
          PRERELEASE_DATE=$(echo "$PRERELEASE_MOONC_VERSION" | grep -o '([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\})' | tr -d '()')
          echo "Pre-release date: $PRERELEASE_DATE"
          echo "prerelease-date=$PRERELEASE_DATE" >> $GITHUB_OUTPUT

      - name: check if should skip
        id: check
        run: |
          LATEST_DATE="${{ steps.latest.outputs.latest-date }}"
          PRERELEASE_DATE="${{ steps.prerelease.outputs.prerelease-date }}"
          BRANCH_NAME="${{ github.ref_name }}"

          echo "Latest date: $LATEST_DATE"
          echo "Pre-release date: $PRERELEASE_DATE"
          echo "Branch name: $BRANCH_NAME"

          # Always run for pre-release branches
          if [[ "$BRANCH_NAME" == pre-release* ]]; then
            echo "Pre-release branch detected, running all jobs"
            echo "should-skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Compare dates (YYYY-MM-DD format)
          if [[ "$LATEST_DATE" < "$PRERELEASE_DATE" ]] ; then
            echo "Pre-release is newer than latest release, running jobs"
            echo "should-skip=false" >> $GITHUB_OUTPUT
          else
            echo "Latest release is newer than or equal to pre-release, skipping jobs"
            echo "should-skip=true" >> $GITHUB_OUTPUT
          fi

  collect-data:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        os:
          - platform: macos-latest
            name: mac
          - platform: ubuntu-latest
            name: linux
          - platform: windows-latest
            name: windows
        channel:
          - channel: latest
            name: stable
          - channel: nightly
            name: nightly
          - channel: pre-release
            name: pre-release
    runs-on: ${{ matrix.os.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: ./.github/actions/setup
        with:
          version: ${{ matrix.channel.channel }}

      - name: Setup MSVC
        if: ${{ matrix.os.platform == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Version
        run: moon version --all

      - name: moon update
        run: |
          moon update

      - name: Build
        if: ${{ matrix.channel.name != 'pre-release' || needs.version-check.outputs.should-skip == 'false' }}
        run: |
          deno run -A main.ts stat --sources resources/sources.yml --build-config resources/build-config.yml --channel ${{ matrix.channel.name }} --max-concurrent-builds 4

      - name: Upload data
        if: ${{ matrix.channel.name != 'pre-release' || needs.version-check.outputs.should-skip == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.name }}-${{ matrix.channel.name }}
          path: "./data/${{ matrix.os.name }}/${{ matrix.channel.name }}/"
          if-no-files-found: error
          retention-days: 1 # Short retention for intermediate artifacts

  publish-site:
    needs: collect-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Download all artifacts from matrix jobs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: List downloaded artifacts
        run: ls -R ./artifacts

      # Organize data files
      - name: Organize data files
        run: |
          mkdir -p data/mac/stable data/mac/nightly data/linux/stable data/linux/nightly data/windows/stable data/windows/nightly
          cp -r artifacts/mac-stable/* data/mac/stable/ 2>/dev/null || true
          cp -r artifacts/mac-nightly/* data/mac/nightly/ 2>/dev/null || true
          cp -r artifacts/linux-stable/* data/linux/stable/ 2>/dev/null || true
          cp -r artifacts/linux-nightly/* data/linux/nightly/ 2>/dev/null || true
          cp -r artifacts/windows-stable/* data/windows/stable/ 2>/dev/null || true
          cp -r artifacts/windows-nightly/* data/windows/nightly/ 2>/dev/null || true

          # Copy pre-release data only if artifacts exist
          if [ -d "artifacts/mac-pre-release" ]; then
            mkdir -p data/mac/pre-release
            cp -r artifacts/mac-pre-release/* data/mac/pre-release/
          fi
          if [ -d "artifacts/linux-pre-release" ]; then
            mkdir -p data/linux/pre-release
            cp -r artifacts/linux-pre-release/* data/linux/pre-release/
          fi
          if [ -d "artifacts/windows-pre-release" ]; then
            mkdir -p data/windows/pre-release
            cp -r artifacts/windows-pre-release/* data/windows/pre-release/
          fi

      # Bundle web.ts to web.js
      - name: Bundle web.js
        run: |
          deno bundle web.ts -o web.js

      # Prepare publish directory
      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp index.html publish/
          cp web.js publish/
          cp -r data publish/

      # Publish to GitHub Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish
          retention-days: 90 # Long retention for GitHub Pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
